apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-ledger-engine
  namespace: payment-system
  labels:
    app: core-ledger-engine
    tier: backend-financial
spec:
  replicas: 6
  selector:
    matchLabels:
      app: core-ledger-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: core-ledger-engine
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: core-ledger-engine-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["core-ledger-engine"]
              topologyKey: "topology.kubernetes.io/zone"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ledger-engine
        image: datavendor.ecr.us-east-1.amazonaws.com/core-ledger-engine:v1.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "8000m"
            memory: "16Gi"
        ports:
        - containerPort: 8080
          name: http-api
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
