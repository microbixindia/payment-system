apiVersion: apps/v1
kind: Deployment
metadata:
  name: b2b-metered-billing
  namespace: payment-system
  labels:
    app: b2b-metered-billing
    tier: streaming-pipeline
spec:
  replicas: 8
  selector:
    matchLabels:
      app: b2b-metered-billing
  template:
    metadata:
      labels:
        app: b2b-metered-billing
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: b2b-metered-billing-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: metered-billing
        image: datavendor.ecr.us-east-1.amazonaws.com/b2b-metered-billing:v1.0.0
        securityContext:
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "8000m"
            memory: "16Gi"
        ports:
        - containerPort: 8082
          name: http-metrics
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
