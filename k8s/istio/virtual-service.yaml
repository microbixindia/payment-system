apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-edge-virtual-service
  namespace: payment-system
spec:
  hosts:
  - "gateway.datavendor.internal"
  gateways:
  - payment-ingress-gateway
  http:
  - match:
    - uri:
        prefix: /api/v1/ledger
    route:
    - destination:
        host: core-ledger-engine.payment-system.svc.cluster.local
        port:
          number: 8080
    timeout: 3s
    retries:
      attempts: 3
      perTryTimeout: 1s
      retryOn: "5xx,connect-failure,refused-stream"
  - match:
    - uri:
        prefix: /api/v1/settlement
    route:
    - destination:
        host: settlement-gateway.payment-system.svc.cluster.local
        port:
          number: 8080
    timeout: 10s
