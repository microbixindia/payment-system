{{- range $key, $service := .Values.services }}
{{- if and $service.enabled $service.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "datavendor-payment-core.fullname" $ }}-{{ $service.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "datavendor-payment-core.serviceLabels" (list $ $service.name) | nindent 4 }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  {{- if $service.pdb.minAvailable }}
  minAvailable: {{ $service.pdb.minAvailable }}
  {{- else if $service.pdb.maxUnavailable }}
  maxUnavailable: {{ $service.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "datavendor-payment-core.selectorLabels" (list $ $service.name) | nindent 6 }}
{{- end }}
{{- end }}
