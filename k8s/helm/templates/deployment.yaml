{{- range $key, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datavendor-payment-core.fullname" $ }}-{{ $service.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "datavendor-payment-core.serviceLabels" (list $ $service.name) | nindent 4 }}
spec:
  {{- if not $service.autoscaling.enabled }}
  replicas: {{ $service.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "datavendor-payment-core.selectorLabels" (list $ $service.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "datavendor-payment-core.serviceLabels" (list $ $service.name) | nindent 8 }}
      annotations:
        {{- if $.Values.global.istio.enabled }}
        sidecar.istio.io/inject: {{ $.Values.global.istio.sidecarInjection | quote }}
        sidecar.istio.io/proxyCPU: {{ $.Values.global.istio.proxyCPURequest | quote }}
        sidecar.istio.io/proxyMemory: {{ $.Values.global.istio.proxyMemoryRequest | quote }}
        sidecar.istio.io/proxyCPULimit: {{ $.Values.global.istio.proxyCPULimit | quote }}
        sidecar.istio.io/proxyMemoryLimit: {{ $.Values.global.istio.proxyMemoryLimit | quote }}
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: {{ $.Values.global.istio.holdApplicationUntilProxyStarts }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ $service.serviceAccount.name | default (include "datavendor-payment-core.fullname" $) }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml $.Values.global.podSecurityContext | nindent 8 }}
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $service.name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $service.image.pullPolicy | default $.Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml $.Values.global.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $service.service.targetPort | default $service.service.port }}
              protocol: TCP
          env:
            {{- range $envKey, $envVal := $service.env }}
            - name: {{ $envKey }}
              value: {{ $envVal | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          {{- if $service.probes.liveness }}
          livenessProbe:
            httpGet:
              path: {{ $service.probes.liveness.path }}
              port: {{ $service.probes.liveness.port }}
            initialDelaySeconds: {{ $service.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $service.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $service.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if $service.probes.readiness }}
          readinessProbe:
            httpGet:
              path: {{ $service.probes.readiness.path }}
              port: {{ $service.probes.readiness.port }}
            initialDelaySeconds: {{ $service.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $service.probes.readiness.timeoutSeconds }}
            successThreshold: {{ $service.probes.readiness.successThreshold | default 1 }}
            failureThreshold: {{ $service.probes.readiness.failureThreshold }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: ephemeral-cache
              mountPath: /var/cache
      volumes:
        - name: tmp-dir
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: ephemeral-cache
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      {{- if $.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $.Values.global.tolerations }}
      tolerations:
        {{- toYaml $.Values.global.tolerations | nindent 8 }}
      {{- end }}
      {{- if $.Values.global.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ $.Values.global.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ $.Values.global.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ $.Values.global.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "datavendor-payment-core.selectorLabels" (list $ $service.name) | nindent 14 }}
      {{- end }}
{{- end }}
{{- end }}
