apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datavendor-payment-core.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datavendor-payment-core.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  CLUSTER_DOMAIN: {{ .Values.global.clusterDomain | quote }}
  LOG_FORMAT: "json"
  ENABLE_TLS13: "true"
  MERKLE_TREE_HASH: "SHA-256"
