{{- range $key, $service := .Values.services }}
{{- if and $service.enabled $service.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $service.serviceAccount.name | default (printf "%s-sa" $service.name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "datavendor-payment-core.serviceLabels" (list $ $service.name) | nindent 4 }}
  {{- with $service.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
