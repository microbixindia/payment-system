[package]
name = "datavendor-sdk"
version = "1.0.0"
edition = "2021"
authors = ["DataVendor Global Infrastructure Team"]
description = "Enterprise Rust SDK for the DataVendor B2B High-Throughput Payment Core with Client-Side 256-bit AES-GCM Encryption"
license = "Proprietary"

[dependencies]
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
subtle = "2.5"
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive", "zeroize_derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.35", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"
